<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Century plaques, sheet 2 back</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&amp;family=IM+Fell+English:ital@0;1&amp;family=EB+Garamond:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 816px; height: 1056px; box-sizing: border-box; padding: 0 48px; background: #ffffff; font-family: 'EB Garamond', Georgia, serif; color: #2f241a; display: flex; flex-direction: column; justify-content: center; gap: 15px">
<div style="margin: 0 -19px; padding: 19px; background: #f6ecd6; display: flex; flex-direction: column; gap: 15px">
  <sc-for list="{{plaques}}" as="p" hint-placeholder-count="2">
    <div style="width: 720px; height: 306px; box-sizing: border-box; border-radius: 0; background: #f6ecd6; padding: 19px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
      <div style="height: 36px; flex-shrink: 0; border-radius: 6px; background: {{p.band}}; color: #fff8ea; display: flex; align-items: center; justify-content: space-between; padding: 0 12px">
        <div style="display: flex; align-items: baseline; gap: 8px">
          <span style="font-family: 'IM Fell English SC', Georgia, serif; font-size: 22px; line-height: 1">{{p.rom}} century</span>
          <span style="font-size: 13px">{{p.years}}</span>
        </div>
        <span style="font-size: 13px">opener's cavalry marks the event</span>
      </div>
      <div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); min-height: 0">
        <sc-for list="{{p.events}}" as="e" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 10px; border-left: {{e.rule}}; min-width: 0">
            <div style="display: flex; align-items: center; gap: 7px">
              <span style="font-size: 14px; font-weight: 600; border: 1.5px solid #2f241a; border-radius: 4px; padding: 0 6px">{{e.die}}</span>
              <span style="font-family: 'IM Fell English SC', Georgia, serif; font-size: 17px; line-height: 1.05; flex: 1; min-width: 0">{{e.title}}</span>
              <span style="width: 28px; height: 28px; flex-shrink: 0; box-sizing: border-box; border: 1.5px dashed #b08a1e; border-radius: 50%"></span>
            </div>
            <div style="display: flex"><span style="font-size: 12px; border: 1px solid #8a7356; border-radius: 99px; padding: 0 7px; color: #5a4632">{{e.timing}}</span></div>
            <div style="font-size: 13.5px; line-height: 1.25">{{e.effect}}</div>
            <div style="margin-top: auto; font-family: 'IM Fell English', Georgia, serif; font-style: italic; font-size: 12px; line-height: 1.2; color: #5a4632">{{e.hist}}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>
  <div style="width: 720px; height: 306px; box-sizing: border-box; border-radius: 0; background: #f6ecd6; padding: 19px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
    <div style="height: 36px; flex-shrink: 0; border-radius: 6px; background: #5a4632; color: #fff8ea; display: flex; align-items: center; justify-content: space-between; padding: 0 12px">
      <span style="font-family: 'IM Fell English SC', Georgia, serif; font-size: 20px; line-height: 1">Century ______</span>
      <span style="font-size: 13px">your own plaque</span>
    </div>
    <div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
      <sc-for list="{{blank}}" as="b" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 24px; padding: 0 10px; border-left: {{b.rule}}">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <span style="font-size: 14px; font-weight: 600; border: 1.5px solid #2f241a; border-radius: 4px; padding: 0 6px">{{b.die}}</span>
            <span style="width: 28px; height: 28px; box-sizing: border-box; border: 1.5px dashed #b08a1e; border-radius: 50%"></span>
          </div>
          <div style="border-bottom: 1px solid #c9b48c"></div>
          <div style="border-bottom: 1px solid #c9b48c"></div>
          <div style="border-bottom: 1px solid #c9b48c"></div>
          <div style="border-bottom: 1px solid #c9b48c"></div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":816,"height":1056}}'>
class Component extends DCLogic {
  renderVals() {
    return {
  "plaques": [
    {
      "rom": "XII",
      "years": "1100–1199",
      "band": "#8e2424",
      "events": [
        {
          "die": "1–2",
          "rule": "none",
          "title": "The Anarchy",
          "timing": "At once",
          "effect": "The leader’s 2 thinnest territories defect to the player with the fewest territories.",
          "hist": "Civil war between Stephen and Matilda; lords switch sides."
        },
        {
          "die": "3–4",
          "rule": "1px dashed #c9b48c",
          "title": "Great floods",
          "timing": "Whole century",
          "effect": "No manoeuvres across rivers. Attacks across a river crossing roll at most 1 die.",
          "hist": "Rivers burst their banks."
        },
        {
          "die": "5–6",
          "rule": "1px dashed #c9b48c",
          "title": "Supply problems",
          "timing": "Whole century",
          "effect": "At the start of the leader’s turn, each of their territories with 5 or more troops loses a third, rounded down.",
          "hist": "The greatest armies can’t be fed."
        }
      ]
    },
    {
      "rom": "XIV",
      "years": "1300–1399",
      "band": "#8e2424",
      "events": [
        {
          "die": "1–2",
          "rule": "none",
          "title": "Black Death",
          "timing": "At once",
          "effect": "Every territory loses half its troops, rounded down, and every hand of territory cards is halved. The player with the fewest territories is spared.",
          "hist": "The plague kills a third of England from 1348."
        },
        {
          "die": "3–4",
          "rule": "1px dashed #c9b48c",
          "title": "Great Famine",

          "hist": "Years of failed harvests from 1315 empty the thinly held lands."

        {

          "hist": "Rebels march on London in 1381."

    }

  "blank": [
    {
      "die": "1–2",
      "rule": "none"

    {
      "die": "3–4",
      "rule": "1px dashed #c9b48c"
    },
    {
      "die": "5–6",
      "rule": "1px dashed #c9b48c"
    }
  ]
};
  }
}
</script>
</body>
</html>
