<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Century plaques, sheet 1 front</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&amp;family=IM+Fell+English:ital@0;1&amp;family=EB+Garamond:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 816px; height: 1056px; box-sizing: border-box; padding: 0 48px; background: #ffffff; font-family: 'EB Garamond', Georgia, serif; color: #2f241a; display: flex; flex-direction: column; justify-content: center; gap: 15px">
  <sc-for list="{{plaques}}" as="p" hint-placeholder-count="3">
    <div style="width: 720px; height: 306px; box-sizing: border-box; border-radius: 19px; background: #f6ecd6; padding: 19px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
      <div style="height: 36px; flex-shrink: 0; border-radius: 6px; background: {{p.band}}; color: #fff8ea; display: flex; align-items: center; justify-content: space-between; padding: 0 12px">
        <div style="display: flex; align-items: baseline; gap: 8px">
          <span style="font-family: 'IM Fell English SC', Georgia, serif; font-size: 22px; line-height: 1">{{p.rom}} century</span>
          <span style="font-size: 13px">{{p.years}}</span>
        </div>
      </div>
      <div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); min-height: 0">
        <sc-for list="{{p.events}}" as="e" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 10px; border-left: {{e.rule}}; min-width: 0">
            <div style="display: flex; align-items: center; gap: 7px">
              <span style="font-size: 14px; font-weight: 600; border: 1.5px solid #2f241a; border-radius: 4px; padding: 0 6px">{{e.die}}</span>
              <span style="font-family: 'IM Fell English SC', Georgia, serif; font-size: 17px; line-height: 1.05; flex: 1; min-width: 0">{{e.title}}</span>
              <span style="width: 28px; height: 28px; flex-shrink: 0; box-sizing: border-box; border: 1.5px dashed #b08a1e; border-radius: 50%"></span>
            </div>
            <div style="display: flex"><span style="font-size: 12px; border: 1px solid #8a7356; border-radius: 99px; padding: 0 7px; color: #5a4632">{{e.timing}}</span></div>
            <div style="font-size: 13.5px; line-height: 1.25">{{e.effect}}</div>
            <div style="margin-top: auto; font-family: 'IM Fell English', Georgia, serif; font-style: italic; font-size: 12px; line-height: 1.2; color: #5a4632">{{e.hist}}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":816,"height":1056}}'>
class Component extends DCLogic {
  renderVals() {
    return {
  "plaques": [
    {
      "rom": "V",
      "years": "410–499",
      "band": "#4f6b3a",
      "events": [
        {
          "die": "1–2",
          "rule": "none",
          "title": "Saxon migration",
          "timing": "Whole century",
          "effect": "Every player gets 2 extra troops at the start of each turn.",
          "hist": "Settlers pour across the North Sea as Rome leaves."
        },
        {
          "die": "3–4",
          "rule": "1px dashed #c9b48c",
          "title": "Roman roads",
          "timing": "Whole century",
          "effect": "You may make 2 manoeuvres per turn. Rivers and mountains don’t stop them.",
          "hist": "The old roads still connect the land."
        },
        {
          "die": "5–6",
          "rule": "1px dashed #c9b48c",
          "title": "Land grab",
          "timing": "At once",
          "effect": "Every player except the leader draws 1 territory card.",
          "hist": "With no one in charge, land goes to whoever takes it."
        }
      ]
    },
    {
      "rom": "VII",
      "years": "600–699",
      "band": "#4f6b3a",
      "events": [
        {
          "die": "1–2",
          "rule": "none",
          "title": "Shield walls",
          "timing": "Whole century",
          "effect": "Attackers roll at most 2 dice.",
          "hist": "Battles are fought shield to shield."
        },
        {
          "die": "3–4",
          "rule": "1px dashed #c9b48c",
          "title": "Peace of the Church",
          "timing": "Whole century",
          "effect": "Pacts can’t be broken. Pacts signed this century pay 1 extra bonus card.",
          "hist": "The Synod of Whitby brings the kingdoms together in 664."
        },
        {
          "die": "5–6",
          "rule": "1px dashed #c9b48c",
          "title": "Underdog kings",
          "timing": "Whole century",
          "effect": "At the start of each turn, the player with the fewest territories gets 3 extra troops.",
          "hist": "Small kingdoms rise while great ones squabble."
        }
      ]
    },
    {
      "rom": "IX",
      "years": "800–899",
      "band": "#7d5a12",
      "events": [
        {
          "die": "1–2",
          "rule": "none",

          "timing": "Whole century",
          "effect": "When attacking the leader, add 1 to your highest die.",
          "hist": "A Viking army lands in 865 and finds the great kingdoms weakest."

        {

          "rule": "1px dashed #c9b48c",
          "title": "Danegeld",
          "timing": "Whole century",
          "effect": "Before trading on their turn, the leader gives their lowest-star card to the player with the fewest territories. With no cards, they place 2 fewer troops and that player gets 2.",
          "hist": "The strong pay the Danes to go away."
        },
        {
          "die": "5–6",
          "rule": "1px dashed #c9b48c",
          "title": "Alfred’s burhs",
          "timing": "Whole century",
          "effect": "Defenders add 1 to their highest die, except the leader.",
          "hist": "Fortified towns hold out against the raiders."
        }
      ]
    }
  ]
};
  }
}
</script>
</body>
</html>
