<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Century plaques, sheet 1 back</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&amp;family=IM+Fell+English:ital@0;1&amp;family=EB+Garamond:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 816px; height: 1056px; box-sizing: border-box; padding: 0 48px; background: #ffffff; font-family: 'EB Garamond', Georgia, serif; color: #2f241a; display: flex; flex-direction: column; justify-content: center">
<div style="margin: 0 -19px; padding: 19px; background: #f6ecd6; display: flex; flex-direction: column">
  <sc-for list="{{plaques}}" as="p" hint-placeholder-count="3">
    <div style="width: 720px; height: 306px; box-sizing: border-box; border-radius: 0; background: #f6ecd6; padding: 19px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
      <div style="height: 36px; flex-shrink: 0; border-radius: 6px; background: {{p.band}}; color: #fff8ea; display: flex; align-items: center; justify-content: space-between; padding: 0 12px">
        <div style="display: flex; align-items: baseline; gap: 8px">
          <span style="font-family: 'IM Fell English SC', Georgia, serif; font-size: 22px; line-height: 1">{{p.rom}} century</span>
          <span style="font-size: 13px">{{p.years}}</span>
        </div>
      </div>
      <div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); min-height: 0">
        <sc-for list="{{p.events}}" as="e" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 10px; border-left: {{e.rule}}; min-width: 0">
            <div style="display: flex; align-items: center; gap: 7px">
              <span style="font-size: 14px; font-weight: 600; border: 1.5px solid #2f241a; border-radius: 4px; padding: 0 6px">{{e.die}}</span>
              <span style="font-family: 'IM Fell English SC', Georgia, serif; font-size: 17px; line-height: 1.05; flex: 1; min-width: 0">{{e.title}}</span>
              <span style="width: 28px; height: 28px; flex-shrink: 0; box-sizing: border-box; border: 1.5px dashed #b08a1e; border-radius: 50%"></span>
            </div>
            <div style="display: flex"><span style="font-size: 12px; border: 1px solid #8a7356; border-radius: 99px; padding: 0 7px; color: #5a4632">{{e.timing}}</span></div>
            <div style="font-size: 13.5px; line-height: 1.25">{{e.effect}}</div>
            <div style="margin-top: auto; font-family: 'IM Fell English', Georgia, serif; font-style: italic; font-size: 12px; line-height: 1.2; color: #5a4632">{{e.hist}}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":816,"height":1056}}'>
class Component extends DCLogic {
  renderVals() {
    return {
  "plaques": [
    {
      "rom": "VI",
      "years": "500–599",
      "band": "#4f6b3a",
      "events": [
        {
          "die": "1–2",
          "rule": "none",
          "title": "Petty kingdoms",
          "timing": "At once",
          "effect": "Every player except the leader gets 2 extra troops on their next turn.",
          "hist": "Small kingdoms rise to check the strongest."
        },
        {
          "die": "3–4",
          "rule": "1px dashed #c9b48c",
          "title": "Plague of Justinian",
          "timing": "At once",
          "effect": "Every territory with 3 or more troops loses 1.",
          "hist": "A pandemic reaches Britain from the Mediterranean."
        },
        {
          "die": "5–6",
          "rule": "1px dashed #c9b48c",
          "title": "Age of saints",
          "timing": "Whole century",
          "effect": "Mission bonuses are doubled.",
          "hist": "Missionaries and monks spread across the land."
        }
      ]
    },
    {
      "rom": "VIII",
      "years": "700–799",
      "band": "#7d5a12",
      "events": [
        {
          "die": "1–2",
          "rule": "none",
          "title": "Viking raids",
          "timing": "At once + century",
          "effect": "The leader’s port territories each lose 2 troops. No attacks along sea routes this century.",
          "hist": "The first raid hits Lindisfarne in 793."
        },
        {
          "die": "3–4",
          "rule": "1px dashed #c9b48c",
          "title": "Offa’s Dyke",
          "timing": "Whole century",
          "effect": "Every border between two regions counts as a river crossing for manoeuvres.",
          "hist": "Kings mark their borders with earthworks."
        },
        {
          "die": "5–6",
          "rule": "1px dashed #c9b48c",
          "title": "Good harvests",
          "timing": "Whole century",
          "effect": "At the start of each turn, get 1 extra troop for every region where you hold 3 or more territories.",
          "hist": "Full barns across England."
        }
      ]
    },
    {
      "rom": "X",
      "years": "900–999",
      "band": "#7d5a12",
      "events": [
        {
          "die": "1–2",

          "title": "One kingdom",

          "effect": "At the start of each turn, every player except the leader gets 3 extra troops.",
          "hist": "Æthelstan’s new kingdom rewards loyal lords."
        },
        {
          "die": "3–4",
          "rule": "1px dashed #c9b48c",
          "title": "Battle of Brunanburh",
          "timing": "Whole century",
          "effect": "Grand alliance: players other than the leader may only attack the leader.",
          "hist": "Scots, Norse and Britons unite against Æthelstan in 937."
        },
        {
          "die": "5–6",
          "rule": "1px dashed #c9b48c",
          "title": "Hard winter",
          "timing": "At once + century",
          "effect": "Every territory with 6 or more troops loses 2. No manoeuvres into mountain territories this century.",
          "hist": "Snow closes the passes."
        }
      ]
    }
  ]
};
  }
}
</script>
</body>
</html>
