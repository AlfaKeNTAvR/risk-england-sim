<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Event cards, 8th to 10th century</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&amp;family=IM+Fell+English:ital@0;1&amp;family=EB+Garamond:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 816px; height: 1056px; box-sizing: border-box; padding: 45px 48px; background: #ffffff; font-family: 'EB Garamond', Georgia, serif; color: #2f241a">
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 15px; width: 720px; height: 966px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="9">
      <div style="box-sizing: border-box; border: 1px solid #8a7356; border-radius: 19px; background: #f6ecd6; padding: 19px; display: flex; flex-direction: column; gap: 6px; overflow: hidden">
        <div style="height: 30px; flex-shrink: 0; border-radius: 6px; background: {{c.band}}; color: #fff8ea; display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
          <div style="display: flex; align-items: baseline; gap: 6px">
            <span style="font-family: 'IM Fell English SC', Georgia, serif; font-size: 20px; line-height: 1">{{c.rom}}</span>
            <span style="font-size: 12px">{{c.years}}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 4px; background: #fff8ea; color: #2f241a; border-radius: 4px; padding: 1px 6px">
            <svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><rect x="1" y="1" width="12" height="12" rx="2.5" fill="none" stroke="#2f241a" stroke-width="1.4"></rect><circle cx="4.5" cy="4.5" r="1.2" fill="#2f241a"></circle><circle cx="9.5" cy="9.5" r="1.2" fill="#2f241a"></circle></svg>
            <span style="font-size: 14px; font-weight: 600">{{c.die}}</span>
          </div>
        </div>
        <div style="font-family: 'IM Fell English SC', Georgia, serif; font-size: 19px; line-height: 1.05">{{c.title}}</div>
        <div style="display: flex"><span style="font-size: 12px; border: 1px solid #8a7356; border-radius: 99px; padding: 0 7px; color: #5a4632">{{c.timing}}</span></div>
        <div style="font-size: 14px; line-height: 1.27">{{c.effect}}</div>
        <div style="margin-top: auto; border-top: 1px solid #c9b48c; padding-top: 5px; font-family: 'IM Fell English', Georgia, serif; font-style: italic; font-size: 12px; line-height: 1.25; color: #5a4632">{{c.hist}}</div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":816,"height":1056}}'>
class Component extends DCLogic {
  renderVals() {
    var mid = '#7d5a12';
    var c = function (rom, years, die, title, timing, effect, hist) {
      return { band: mid, rom: rom, years: years, die: die, title: title, timing: timing, effect: effect, hist: hist };
    };
    return {
      cards: [
        c('VIII', '700–799', '1–2', 'Viking raids', 'At once + century', 'The leader’s port territories each lose 2 troops. No attacks along sea routes this century.', 'The first raid hits Lindisfarne in 793.'),
        c('VIII', '700–799', '3–4', 'Offa’s Dyke', 'Whole century', 'Every border between two regions counts as a river crossing for manoeuvres.', 'Kings mark their borders with earthworks.'),
        c('VIII', '700–799', '5–6', 'Good harvests', 'Whole century', 'At the start of each turn, get 1 extra troop for every region where you hold 3 or more territories.', 'Full barns across England.'),
        c('IX', '800–899', '1–2', 'Great Heathen Army', 'Whole century', 'When attacking the leader, add 1 to your highest die.', 'A Viking army lands in 865 and finds the great kingdoms weakest.'),
        c('IX', '800–899', '3–4', 'Danegeld', 'Whole century', 'Before trading on their turn, the leader gives their lowest-star card to the player with the fewest territories. With no cards, they place 2 fewer troops and that player gets 2.', 'The strong pay the Danes to go away.'),
        c('IX', '800–899', '5–6', 'Alfred’s burhs', 'Whole century', 'Defenders add 1 to their highest die, except the leader.', 'Fortified towns hold out against the raiders.'),
        c('X', '900–999', '1–2', 'One kingdom', 'Whole century', 'At the start of each turn, every player except the leader gets 3 extra troops.', 'Æthelstan’s new kingdom rewards loyal lords.'),
        c('X', '900–999', '3–4', 'Battle of Brunanburh', 'Whole century', 'Grand alliance: players other than the leader may only attack the leader.', 'Scots, Norse and Britons unite against Æthelstan in 937.'),
        c('X', '900–999', '5–6', 'Hard winter', 'At once + century', 'Every territory with 6 or more troops loses 2. No manoeuvres into mountain territories this century.', 'Snow closes the passes.')
      ]
    };
  }
}
</script>
</body>
</html>
