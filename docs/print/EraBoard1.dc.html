<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Era board, 5th to 9th century</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&amp;family=IM+Fell+English:ital@0;1&amp;family=EB+Garamond:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1056px; height: 816px; box-sizing: border-box; padding: 40px 48px; background: #f3e7cf; font-family: 'EB Garamond', Georgia, serif; color: #2f241a; display: flex; flex-direction: column; gap: 10px">
  <div style="height: 44px; flex-shrink: 0; display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 2px solid #5a4632; padding-bottom: 6px">
    <span style="font-family: 'IM Fell English SC', Georgia, serif; font-size: 32px; line-height: 1">The Ages of England</span>
    <span style="font-size: 14px; color: #5a4632">The cavalry stands on its century. Roll, then mark the event: 1–2, 3–4 or 5–6.</span>
  </div>
  <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
    <div style="flex: 1; min-height: 0; display: flex; gap: 10px">
      <div style="width: 112px; flex-shrink: 0; border-radius: 8px; background: {{r.band}}; color: #fff8ea; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
        <span style="font-family: 'IM Fell English SC', Georgia, serif; font-size: 30px; line-height: 1">{{r.rom}}</span>
        <span style="font-size: 12px">{{r.years}}</span>
        <span style="width: 40px; height: 40px; box-sizing: border-box; border: 1.5px dashed #fff8ea; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; line-height: 1">cavalry</span>
      </div>
      <sc-for list="{{r.events}}" as="e" hint-placeholder-count="3">
        <div style="flex: 1; min-width: 0; border: 1px solid #c9b48c; border-radius: 8px; background: #fbf4e4; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px">
          <div style="display: flex; align-items: center; gap: 7px">
            <span style="font-size: 13px; font-weight: 600; border: 1.5px solid #2f241a; border-radius: 4px; padding: 0 5px">{{e.die}}</span>
            <span style="font-family: 'IM Fell English SC', Georgia, serif; font-size: 17px; line-height: 1.05; flex: 1; min-width: 0">{{e.title}}</span>
            <span style="width: 22px; height: 22px; flex-shrink: 0; box-sizing: border-box; border: 1.5px dashed #8a7356; border-radius: 50%"></span>
          </div>
          <span style="font-size: 12px; color: #5a4632">{{e.timing}}</span>
          <span style="font-size: 13px; line-height: 1.22">{{e.effect}}</span>
        </div>
      </sc-for>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1056,"height":816}}'>
class Component extends DCLogic {
  renderVals() {
    var dies = ['1–2', '3–4', '5–6'];
    var ev = function (i, title, timing, effect) { return { die: dies[i], title: title, timing: timing, effect: effect }; };
    var E = '#4f6b3a', M = '#7d5a12';
    return {
      rows: [
        { band: E, rom: 'V', years: '410–499', events: [
          ev(0, 'Saxon migration', 'Whole century', 'Every player gets 2 extra troops at the start of each turn.'),
          ev(1, 'Roman roads', 'Whole century', 'You may make 2 manoeuvres per turn. Rivers and mountains don’t stop them.'),
          ev(2, 'Land grab', 'At once', 'Every player except the leader draws 1 territory card.')
        ] },
        { band: E, rom: 'VI', years: '500–599', events: [
          ev(0, 'Petty kingdoms', 'At once', 'Every player except the leader gets 2 extra troops on their next turn.'),
          ev(1, 'Plague of Justinian', 'At once', 'Every territory with 3 or more troops loses 1.'),
          ev(2, 'Age of saints', 'Whole century', 'Mission bonuses are doubled.')
        ] },
        { band: E, rom: 'VII', years: '600–699', events: [
          ev(0, 'Shield walls', 'Whole century', 'Attackers roll at most 2 dice.'),
          ev(1, 'Peace of the Church', 'Whole century', 'Pacts can’t be broken. Pacts signed this century pay 1 extra bonus card.'),
          ev(2, 'Underdog kings', 'Whole century', 'At the start of each turn, the player with the fewest territories gets 3 extra troops.')
        ] },
        { band: M, rom: 'VIII', years: '700–799', events: [
          ev(0, 'Viking raids', 'At once + century', 'The leader’s port territories each lose 2 troops. No attacks along sea routes this century.'),
          ev(1, 'Offa’s Dyke', 'Whole century', 'Every border between two regions counts as a river crossing for manoeuvres.'),
          ev(2, 'Good harvests', 'Whole century', 'At the start of each turn, get 1 extra troop for every region where you hold 3 or more territories.')
        ] },
        { band: M, rom: 'IX', years: '800–899', events: [
          ev(0, 'Great Heathen Army', 'Whole century', 'When attacking the leader, add 1 to your highest die.'),
          ev(1, 'Danegeld', 'Whole century', 'Before trading on their turn, the leader gives their lowest-star card to the player with the fewest territories. With no cards, they place 2 fewer troops and that player gets 2.'),
          ev(2, 'Alfred’s burhs', 'Whole century', 'Defenders add 1 to their highest die, except the leader.')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
